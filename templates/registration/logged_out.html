{% extends 'base.html' %}
{# Logout page (Honghao, §5.1): shown by Django's LogoutView after the session
   is cleared, with a link to log back in. #}
{% block title %}Logged out{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="h4">You have been logged out.</h1>
  <a class="btn btn-primary mt-3" href="{% url 'login' %}">Log in again</a>
</div>
{% endblock %}
