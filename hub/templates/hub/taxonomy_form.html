{% extends 'base.html' %}
{% block title %}Add {{ kind }} · CourseShare Hub{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card"><div class="card-body p-4">
    <h1 class="h4 mb-4 text-capitalize">Add {{ kind }}</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'partials/_form.html' %}
      <button class="btn btn-primary" type="submit"><i data-lucide="plus"></i>Add {{ kind }}</button>
      <a class="btn btn-link" href="{% if kind == 'course' %}{% url 'course_list' %}{% else %}{% url 'category_list' %}{% endif %}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
