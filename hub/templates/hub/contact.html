{% extends 'base.html' %}
{% block title %}Contact Us · CourseShare Hub{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <h1 class="h4 mb-3">Contact Us</h1>
  <p class="text-muted">Questions or feedback? Send us a message and we'll get back to you.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'partials/_form.html' %}
    <button class="btn btn-primary" type="submit">Send message</button>
  </form>
</div></div>
{% endblock %}
